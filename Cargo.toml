[package]
name = "cr-dash-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
askama = "0.15"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"
